[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decoyopt"
version = "0.1.0"
description = "Decoy-aware enzyme discrimination and CLEAN EC prediction with ProtT5"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6,<3", "numpy>=1.26,<3", "scikit-learn>=1.4,<2",
  "pycm>=4,<5", "tqdm>=4.66", "transformers>=4.31,<5",
  "sentencepiece>=0.2", "gdown>=5,<6",
]

[project.scripts]
decoyopt = "decoyopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
